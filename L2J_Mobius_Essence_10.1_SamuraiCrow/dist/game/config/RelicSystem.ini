# ---------------------------------------------------------------------------
# Relic System Settings
# ---------------------------------------------------------------------------
# The defaults are set to be retail-like. If you modify any of these settings your server will deviate from being retail-like.
# Warning: 
# Please take extreme caution when changing anything. Also please understand what you are changing before you do so on a live server.

# Enable the Relic System
# Default: True
RelicSystemEnabled = True

# Enable detailed player message for debug purpose
# Default: False
RelicSystemDebugEnabled = False

# Relic Announcements
# Announce relic on summon
# Default: True
RelicSummonAnnounce = True
# Announce relic on summon
# Default: True
RelicCompoundAnnounce = True
# Announce only B/A Grade relics
# Default: True
RelicAnnounceOnlyABGrade = False

# Relic Unconfirmed list limits
# Default: 100
RelicUnconfirmedListLimit = 100
# Default: 7 days
RelicUnconfirmedTimeLimit = 7

# Relic Compound Limit
# Modifies the Guaranteed Compound Limit
# The point limit is capped at 165 per grade.
# This value can be divided by any desired limit
# as long as the division doesn't break.
#
# Recommended values:
# 1, 3, 5, 11 (Retail), 15, 33, 55, 165
#
# 1 chance = use all 165 points
# 3 chances = use 55 points
# 5 chances = use 33 points
# 11 chances = use 15 points (Retail)
# 15 chances = use 11 points
# 33 chances = use 5 points
# 55 chances = use 3 points
# 165 chances = use 1 point
# Default: 11
RelicGuaranteedCompoundLimit = 11