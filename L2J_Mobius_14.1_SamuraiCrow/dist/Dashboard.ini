# Local Control Center configuration loaded with ConfigReader.
# Setting names are intentionally flat and descriptive.
# Service ports must match the corresponding Server.ini files.
# =============================================================================

# -----------------------------------------------------------------------------
# MONITORING
# -----------------------------------------------------------------------------

# How often the Control Center checks Login Server and Game Server process/port health.
# Milliseconds. Valid range: 250-10000. Default: 1000.
MonitorHealthCheckMs = 1000

# How often JVM telemetry is collected while a visible page needs it.
# Milliseconds. Valid range: 500-60000. Default: 2000.
MonitorTelemetryMs = 2000

# -----------------------------------------------------------------------------
# CONSOLE
# -----------------------------------------------------------------------------

# Maximum console messages retained per managed service.
# Older messages are discarded from the central history. Valid range: 1000-100000. Default: 10000.
ConsoleMaxLines = 10000

# -----------------------------------------------------------------------------
# TELEMETRY HISTORY
# -----------------------------------------------------------------------------

# Maximum telemetry samples retained for each history chart.
# At 2000 ms, 1800 samples represent about 60 minutes. Valid range: 60-20000. Default: 1800.
TelemetryHistorySamples = 1800

# -----------------------------------------------------------------------------
# ALERTS
# -----------------------------------------------------------------------------

# CPU usage percentage that triggers a warning.
# Valid range: 1-100. Default: 90.
AlertCpuPercent = 90

# JVM heap usage percentage that triggers a warning.
# Valid range: 1-100. Default: 85.
AlertHeapPercent = 85

# Minimum free disk percentage before a warning is displayed.
# Valid range: 1-99. Default: 10.
AlertDiskFreePercent = 10

# -----------------------------------------------------------------------------
# SERVICE CONTROL
# -----------------------------------------------------------------------------

# Maximum time to wait for a managed service to stop gracefully.
# Seconds. Valid range: 5-300. Default: 30.
ServiceShutdownTimeoutSeconds = 30

# Start Login Server automatically when Game Server requires it.
# Values: true / false. Default: true.
ServiceAutoStartLogin = True

# Optional full path to the Java executable used to launch managed services.
# Leave empty to use JAVA_HOME or the Java runtime running the Control Center.
ServiceJavaPath = C\:Program FilesBellSoftLibericaJDK-25binjava.exe

# -----------------------------------------------------------------------------
# LOCAL MANAGEMENT
# -----------------------------------------------------------------------------

# Authentication token used by the local management MXBean.
# Generated automatically when empty. Keep this value private.
ManagementControlToken = b3150ab88c3bf1fe3302a10126299caa678c703a46ca0723

# -----------------------------------------------------------------------------
# SERVICE PORTS
# -----------------------------------------------------------------------------

# Login Server client port used as the fallback when Server.ini cannot be read.
# Must match LoginserverPort. Default: 2106.
LoginPort = 2106

# Game Server client port used as the fallback when Server.ini cannot be read.
# Must match GameserverPort. Default: 7777.
GamePort = 7777

# -----------------------------------------------------------------------------
# INTERFACE
# -----------------------------------------------------------------------------

# Width of the left navigation panel in pixels.
# Valid range: 150-320. Default: 190.
NavigationWidth = 190

# -----------------------------------------------------------------------------
# MAP EXTRACTOR
# -----------------------------------------------------------------------------

# Last selected Lineage II client root.
# Leave empty until a client is selected.
MapExtractorClientPath = 

# Optional reference geodata directory used for comparison workflows.
# Leave empty when no reference dataset is used.
MapExtractorReferenceGeodataPath = 

# Output directory for generated Map Extractor data.
# Leave empty to use game/data/geodata in this distribution.
MapExtractorOutputPath = 

# Generate .l2j geodata files.
# Values: true / false. Default: true.
MapExtractorGenerateGeodata = True

# Generate door XML when supported by the selected client data.
# Values: true / false. Default: false.
MapExtractorGenerateDoors = False

# Generate water-zone XML when supported by the selected client data.
# Values: true / false. Default: false.
MapExtractorGenerateWater = False

# Preferred detected map variant suffix.
# Leave empty for the standard map set. The available variants come from the selected client.
MapExtractorMapVariant = 

# -----------------------------------------------------------------------------
# WINDOW
# -----------------------------------------------------------------------------

# Saved horizontal window position.
# Use -1 for automatic placement.
WindowX = 117

# Saved vertical window position.
# Use -1 for automatic placement.
WindowY = 135

# Saved Control Center width in pixels.
# Valid range: 980-5000. Default: 1440.
WindowWidth = 1440

# Saved Control Center height in pixels.
# Valid range: 680-4000. Default: 860.
WindowHeight = 865

# Restore the Control Center maximized on the next launch.
# Values: true / false. Default: false.
WindowMaximized = false

