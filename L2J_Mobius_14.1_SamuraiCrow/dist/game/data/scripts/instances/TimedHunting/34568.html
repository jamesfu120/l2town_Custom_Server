<html><body>伊納德里爾的國防軍巡邏隊:<br>法富里翁軍隊的突然攻擊使我的頭腦扭轉.第一批法富里翁計程車兵可以在北方的沉默之野中找到,試圖征服克羅芬人.第二批由精英戰士組成,正在南方的聲之野建立營地.<br>根據我們的偵察隊的資料,法富里翁的皇室兵 - - 水龍的最有技能和最具裝備的戰士 - - 正在前往魚海灘. 如果你去那裡,你一定要非常小心.<br>
很久以前，希莉恩被驅逐出天界。在痛苦與折磨中，她生下了自己的怪物子女，並自封為死神女神。據傳，自那以後，亡者便尋找通往希莉恩聖所的道路。他們遊蕩於那些土地，擾亂生者的生活，直到順奈曼下令將聖所封印，並建造「希莉恩之印」。<br>
