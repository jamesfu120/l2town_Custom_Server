<html><body>大師葛伊德：<br>
無論我曾遊歷何處、經歷何事，仍有一件事我無法理解：為什麼即使稍微提及黑魔法，人類就會興奮到極點？<br>
他們毫不費力地以劍與長矛互相殺害，對謀劃與陰謀也毫不猶豫……<br>
那麼為什麼會有如此極端的反應？一定還有其他原因。也許這是某種反向心理？也許他們其實在研究黑暗魔法，但不想讓其他人知道？哈哈，這很合理。我甚至不奇怪象牙塔裡可能還有一個秘密的黑暗魔法設施……<br>
