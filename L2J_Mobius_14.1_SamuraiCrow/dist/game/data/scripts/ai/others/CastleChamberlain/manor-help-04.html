<html><body>凌晨 4:30 點,我們將從我們的 ?? 庫中提取購買種子或作物所需的資金.<br>如果這小時沒有足夠的資金, 一天就不會運作. 請不要忘記.<br>晚上8點, 日購物預算剩餘的商品將被重新存入櫃.<br><br>種子和作物的銷售價格和價格不能設定在標準價格的價格以下或以上.<br>設定的數量與常見的種子和改進的種子不同.<br>在常規品種的情況下,購買額可能略高於我們的的種子銷售額,因為收割機會較高.但是,在改良品種的情況下,購買額低於種子銷售額,因為收割機會較低.請記住這一點.<br>在這個範圍內, 應被設定在農夫和主人都能滿意主人的決定的地方.<br><br>
