<html><body><br><br><center>世界奧林匹亞規則</center><br>
世界奧林匹亞競賽於每週五及週六的 20:00 至 23:40 舉行。<br>
一對一決鬥不設任何職業限制。<br>
競賽結果取決於雙方造成的傷害量。<br>
對維因召喚士的使魔、泰爾巨匠的魔像、席格爾煉獄騎士的血豹所造成的任何傷害均不列入計算，亦不會影響最終勝負結果。<br>
只要在世界奧林匹亞中參加超過 25 場比賽，無論勝負結果如何，皆可獲得「戰鬥標章」。<br>
