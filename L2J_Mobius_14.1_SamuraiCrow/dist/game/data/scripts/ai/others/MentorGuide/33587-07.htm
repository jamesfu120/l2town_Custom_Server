<html><body>師徒導覽員：<br>
<font color="LEVEL">1. 導師的輔助狀態稱為「徒弟的感謝」</font>。<br1>
徒弟的感謝是給予導師的輔助狀態，效果為獲得經驗值/SP +5%，且僅在徒弟處於上線狀態時才會生效。<br>
<font color="LEVEL">2. 徒弟的輔助狀態</font>。<br1>
徒弟可獲得以下效果：<font color="LEVEL">樂師的旋律 - 導師、奏鳴曲演奏 - 導師、導師的協調</font>。這些效果在導師上線期間會持續生效，若導師離線則會在 5 分鐘後消失。<br>
<font color="LEVEL">3. 徒弟能力強化與徒弟召喚導師</font><br1>
導師可以使用同名技能，為徒弟施放強力的<font color="LEVEL">導師的誘惑藝術</font>輔助狀態。<br>
導師只有在徒弟位於附近時才能使用該技能。徒弟則擁有特殊的<font color="LEVEL">徒弟召喚導師</font>技能，可快速移動到導師身邊。<br>
您可以在技能視窗的<font color="LEVEL">血盟/英雄/師徒技能</font>欄位中找到它。<br>
