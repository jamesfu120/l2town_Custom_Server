<html><body>師徒導覽員：<br>
一位導師最多可以收 3 名徒弟。每當徒弟升級時，導師就會透過郵件收到<font color="LEVEL">徒弟的印章</font>，這些印章可用來交換珍貴的道具。<br>
<font color="LEVEL">[達成各等級可獲得的徒弟的印章數量]</font><br1>
Lv. 85：5,000 個<br1>
Lv. 99：10,000 個<br1>
Lv. 103：25,000 個<br1>
Lv. 105：60,000 個<br>
從信件中領取印章後，別忘了刪除信件。如果信箱已滿，將無法再接收新的道具。<br>
若導師與徒弟同時在線遊玩，導師將獲得<font color="LEVEL">強力的輔助狀態</font>，而徒弟則會<font color="LEVEL">獲得經驗值/SP 加成</font>。<br>
