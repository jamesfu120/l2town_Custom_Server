<html><body>開啟<font color="LEVEL">好友管理 (Alt+Y)</font> 並點擊<font color="LEVEL">師徒</font>分頁中的 <font color="LEVEL">+</font> 按鈕，即可向其他角色提出收徒邀請。<br>
例如，成為導師後，便可以在師徒分頁中選擇要收為徒弟的角色。<br>
並非所有角色都能成為導師或徒弟。角色必須已完成<font color="LEVEL">覺醒</font>且達到 <font color="LEVEL">Lv. 105</font> 以上，才能成為<font color="LEVEL">導師</font>；而想成為<font color="LEVEL">徒弟的角色等級不可高於 Lv. 104</font>。<br>
徒弟完成修練畢業後，導師在 1 天內無法再收新徒弟；若因其他原因中途解除師徒關係，導師則在 2 天內無法再收新徒弟。<br>
