<html><body>長老 凱克洛普斯：<br>
歡迎你啊，我是闇天使長老 凱克洛普斯。<br>
我曾和巨人生活在同一個時期，也是因為巨人才被創造出來的，唯一能看著闇天使種族到現在的所有成長之人就是我了。<br>
直到現在我都在查看著大陸的狀況，像我這種活了這麼久的人親自出面是能做什麼，但是，因為我實在是無法同意復活的巨人們打算滅掉我們並創造出屬於巨人的大陸這點，所以才這樣親自出面行動了。<br>
