<html><body>次元思想家 露依奈：<br>
<font color="LEVEL">次元的龜裂</font>是在發現次元裂痕後，進行亞丁城和象牙塔的額外調查時發現的現象。在已廢棄的麑道地下墓穴掌握到的那些可疑動靜可以算是開端。<br>
麑物開始在麑道地下墓出現，因為察覺到微妙的不協調感，想說最近鼗生與次元有關的那些事件會不會與此相關，所以才加人了這次的調查工作。<br>
後來才知道，隨著次元裂痕擴張，原來的次元的龜裂也會變大，魔道地下墓穴現在已經是被次元的龜裂完全吞噬的狀態了。不知該說是幸還是不幸，雖然次元的龜裂脫離魔道地下墓穴後並沒有再擴大下去，但總不能坐視這狀况不管，所以目前正在進行次元的龜裂的討伐作戰。<br>
次元的龜裂比次元裂痕還要危險，也就是說是個必須更加小心的地方。<br>
