<html><body>傑維爾：<br>
幾百年來，我們一族已從精靈的詛咒中解脫。然而，我仍記得我的皮肉在陽光下灼燒的痛苦。無數年來，我們被迫生活在地底的黑暗中，僅在夜晚才得以上到地表。<br>
感謝長老的研究，迫使我們陷入黑暗的詛咒已被打破，我們已重新佔領了曾為我們家園的森林。但我們仍居住在這座地下城中，總有一天，我們將對曾迫害我們的精靈與人類帶來戰爭與報復。<br>
那些驅逐我們的光明兄弟，以及用惡毒詭計嘲笑我們的人類，將不會被原諒。但事實上，我曾記憶起很久以前，我們所有人曾在月光下共舞，沿河欣賞詩歌與音樂……或許，我們因仇恨與報復而遺忘了如何享受生活……<br>
