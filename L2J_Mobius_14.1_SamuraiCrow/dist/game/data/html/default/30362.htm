<html><body>安德莉亞：<br>
你好，我是安德莉亞，世界樹護衛。天氣真好啊！我們精靈森林中的世界樹，在這樣的好天氣下一定會心情愉悅。<br>
對了，你知道嗎？如果你前往印那力的人類地區，會發現另一個村莊，我們的兄弟 Elves 正住在那裡？你不知道吧？<br>
其實，我本人並未親自前往，但……那些希望在新地點定居的精靈們出發建立了印那力，那地方離這裡很遠。他們說，他們是為了思念故鄉，才像我們的村莊一樣建造了它，但我很好奇它長什麼樣子。他們那裡一定也有人負責管理世界樹之林吧？你不這麼認為嗎？我希望能有朝一日與他們相見。<br>
