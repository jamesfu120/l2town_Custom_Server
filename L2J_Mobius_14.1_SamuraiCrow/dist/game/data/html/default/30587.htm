<html><body>坎塔克 蘇 烏魯吐：<br/>
聽著，年輕的冒險者！我將告訴你我們族人的起源。起初，有帕阿格裡奧。獸人祖先從熾熱的火焰中誕生。他的髮絲如火般飛揚；雙眼怒視，任何敢直視他眼睛的人，都必須因痛苦而轉身。他的肺部噴出灰燼；他血管中的血液熱如熔岩。毫不奇怪，世上沒有人能與他的力量和活力點數相提並論！<br/>
年歲流逝，時間讓水之能量冰凍他的身體，土之能量冷卻他的血液，風吹散他肺腑的灰燼。失去力量的獸人祖先陷入悲慘。目睹此狀，帕阿格裡奧向他揭示了最深的秘密：激烈的戰鬥能使他的血液再度沸騰，嚴格的訓練能讓他恢復昔日的力量。自那以後，獸人以強大聞名，而我們的武器 mastery 已成為傳說！
</body></html>
