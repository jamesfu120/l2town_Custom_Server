<html><body>約拿斯：<br/>
你好，旅人。我是奇巖來的廚師約拿斯。我來參加這場 <font color="LEVEL">烹飪比賽</font> 將在此舉行的。<br/>
這場烹飪比賽對我意義重大。傳統上，我家族的男性都走騎士之路，但我拒絕了這項傳統，選擇了廚師之路。從小我對劍術一無所長，卻比任何事都更愛烹飪。<br/>
但我父親無法理解。我因挫敗感而心緒萬分，氣憤之下宣佈，我寧願成為全國最傑出的廚師而聞名，也不願成為一個無人認可的國籍騎士，然後我離家出走。自那以後，我在多位著名大廚手下工作了超過十年，學習他們的技藝。<br/>
我決心在這場比賽中表現出色，贏得廚師的肯定。這是我唯一能再次面對家人的方法。<br/>
