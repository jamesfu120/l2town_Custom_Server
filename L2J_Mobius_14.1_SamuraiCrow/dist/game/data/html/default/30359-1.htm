<html><body>長老凱塔爾：<br>
<font color="LEVEL">大凱恩</font> ——毀滅之主，黑暗之父！若穿透我們雙眼的陽光是由艾因哈薩德所製造，則吞噬光明的黑暗便是黑暗君主格蘭·凱恩所創造。其他種族稱格蘭·凱恩為魔鬼，畏懼他，並排斥他的信徒。<br>
然而，當傍晚的闇魔漸漸覆蓋大地時，格蘭凱恩的力量將超越所有神明——當光熄滅、火焰熄滅、風息止時，大地將裂開，所有河流與海洋將乾涸。然後，唯有黑暗將餘留……<br>
