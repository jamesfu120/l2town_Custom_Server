<html><body>長老巴蘭克：<br>
我 guild 專注於各族之間的交易。我們是交易與外交的專家。當其他族類為榮譽與政治利益而戰時，我 guild 見利為權力之路。我 guild 不販售日常瑣碎必需品！我們只經營黃金、白銀、珠寶、飾品及珍貴魔法物品。<br>
