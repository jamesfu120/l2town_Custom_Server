<html><body>總督布魯克斯：<br/><br/>
試煉洞亦稱創始洞，乃我族創始者所創之聖地，供奉我族先祖遺骸。<br/>
起初，大 <font color="LEVEL">帕阿格裡奧</font> 我們以火種的種子創造了我們的族類。但其他神明害怕我們的力量，便聯合起來殺害了我們的創造者。他們以水淹沒了永恆之火，風散佈了他身體的灰燼，大地掩蓋了他最後的一絲痕跡。<br/>
但在他臨終之際，帕阿格裡奧命令我們變得更強大。千百年來，我們一直努力遵從他的命令。這片地方——試煉洞穴——正是我族活生生歷史的起點……<br/>
