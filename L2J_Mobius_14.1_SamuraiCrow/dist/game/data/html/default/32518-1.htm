<html><body>渦輪:<br>混亂的渦輪... 一塊... 神秘的力量...<br>Aerial Cleft... 這是一場戰場,可以透過一個小的渦輪大廳進入,釋放出神秘的能量. 當你註冊時,你可以選擇紅色藍色的團隊. 當每支團隊的會員數量超過9人時,戰場自動啟動.<br>你必須能夠將自己轉化為一個<font color="00FFFF">飛翔的變形物體</font>到戰場. 各團隊的成員透過攻擊其他團隊的PC或摧毀在戰場的壓縮機獲得分數. 如果能量集中在一個成員身上,他們就會成為集中攻擊目標 (CAT).當你放下那個目標時,你可以獲得獎金點.<br>贏得的團隊獲得了精彩的碎片 星石.將這些與種子能量結合在一起 你可以使用建立的轉換器,將這些轉換成強大的屬性晶體. </body></html>
