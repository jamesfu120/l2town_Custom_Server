<html><body>長老亞琳：<br>
當其他族裔揮舞竹矛與石斧時，我族祖先已製造銅器，並開始學習鋼鐵的奧秘。黑鐵鍛造公會透過精細的工藝與崇高的匠人精神，繼承祖先的傳統。我公會孕育了矮人歷史上的所有偉大匠人。我們的米斯利爾武器與 adamantite 防具，在任何市場上皆以最高價出售。<br>
此外，我公會成員對巨人遺失的科學與技術研究比任何人都深入。我們所製造的攻城高崙與飛行船，皆源自此類研究。<br>
