<html><body>維度守護者:<br/>你知道嗎? 這些墓,死地,原本是由 Shunaiman 的章封印在另一個維度,以及魔力掩蓋了羅的深淵,而利利思是為了吸引而創造的?<br/>密封被打破時,這些結構在這個維度出現了!結果,密封的力量爆炸了,密封的碎片被散佈在全區域.部分能量撞擊了維度牆,造成了一個小的裂.透過這個裂,形成了清潔這個世界之間的路徑!這是我們所謂的維度空隙!<br/>時間 空間在那裡幾乎是不可辨認的,所以很明智不要呆在任何一個中太久!<font color="LEVEL">這樣的尺寸是零碎的.</font>為了進入 t 這個碎片是由被破碎的密封時釋放的力造成的.</body></html>
