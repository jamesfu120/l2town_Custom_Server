<html><body>探險隊員凱普龍：<br>
如您所知，這座塔是巴溫最偉大的成就，也是楓洛德恩帝國最後一位君王的傑作。即使當時最先進的人類建築師也無法想像這項成就。<br>
巴溫綁架了十名精靈建築師，迫使他們設計這座壯觀的守護塔。工程完成後，他下令處決所有參與建造的人，從精靈建築師一直到最卑微的勞工。這確保了沒有人會永遠揭發這座塔的秘密。<br>
這一招殘忍的天才之舉成功達到了預期效果。此秘密已遺失千年。灰柱公會決心揭開守護塔的秘密，並派遣一支研究團隊前往調查。<br>
