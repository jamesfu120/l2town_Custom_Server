<html><body>馬利尤斯：<br>
我是馬利尤斯·格雷米斯特。原本我來自精靈森林，但曾作為騎士效命於 <font color="LEVEL">瓦爾德納男爵</font> 過去三十年來，我為古魯丁而戰。我在對抗艾爾莫爾及攻佔格拉西亞的戰爭中，與男爵的親衛隊並肩作戰。<br>
