<html><body>卡瑞 巴司柏 閣下：<br/>
您好，我是克勞斯·瓦斯珀，瓦斯珀家族首位保護古魯丁省五代的子弟，亦為榮耀的陸地騎士聯盟成員，由國王卡德穆斯冊封為西境護衛騎士。<br/>
流浪吟遊詩人所歌頌的騎士浪漫已遺忘於此世代，我們這些騎士亦被世人視為舊時代的遺物。然而，我們是承繼了一項跨越千年的偉大遺產——自帝國時代以來便持續傳承至今，我們承受世人的譏諷與輕視，卻毫無一刻放棄我們的驕傲，靜靜站立於我們正義的戰爭之中。<br/>
