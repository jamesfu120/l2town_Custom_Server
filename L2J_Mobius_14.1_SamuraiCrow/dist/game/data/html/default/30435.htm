<html><body>雷歐波爾德：<br>
很高興認識你，旅人。我是雷歐波爾德，黑龍傭兵隊第三小隊的指揮官。我們的部隊與本大陸任何騎士一樣莊嚴勇敢。去年夏天，當龍族淹沒龍谷時，正是我們黑龍隊守衛奇巖城堡；而在攻打浮城乙因的戰鬥中，我們也擊敗了阿貝蘭海盜。<br>
目前，我們已受古魯丁領主之聘，驅逐格拉西亞殘餘的部隊。我們絕不可誤以為他們是驚慌逃亡計程車兵。我們面對的是臭名昭著的 <font color="LEVEL">豺狼部隊</font>以殘暴與掠奪而聞名的。<br>
