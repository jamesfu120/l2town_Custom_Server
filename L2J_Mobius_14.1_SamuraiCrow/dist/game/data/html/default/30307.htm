<html><body>鐵匠卡羅伊德：<br/>
顯然，精靈是黑smith的專家，雖然他們專注於米斯利爾。無疑，這是一種完美的材料……堅固、輕盈，且適合魔法增強。<br/>
但我超越了這項傳統，也研究其他金屬。我知道如何處理 adamantite 和 damascus，不久前我也學會瞭如何處理 oriharukon。<br/>
