<html noscrollbar>
	<body>
		<table width=700>
			<tr>
				<td height=10></td>
			</tr>
		</table>
		<table width=20>
			<tr>
				<td>
					%navigation%
				</td>
				<td>
					<center>
						<table border=0 cellpadding=0 cellspacing=0 width=555 height=455 background="L2UI_CT1.Windows_DF_TooltipBG">
							<tr>
								<td align=center valign=top>
									<br>
									<!-- 1. 上方伺服器資訊表格（獨立置中） -->
									<table border=0 cellpadding=0 cellspacing=0 width=240>
										<tr>
											<td align=center>
												<table border=0 cellpadding=0 cellspacing=0 width=240 height=18 bgcolor="444444">
													<tr>
														<td width=240><font color="009393">       線上玩家 </font>[ <font color="LEVEL">%onlineAll%</font> ]</td>
													</tr>
												</table>
												<table border=0 cellpadding=0 cellspacing=0 width=240 height=18 bgcolor="000000">
													<tr>
														<td width=240><font color="009393">       離線商店 </font>[ <font color="LEVEL">%offlineTrade%</font> ]</td>
													</tr>
												</table>
												<table border=0 cellpadding=0 cellspacing=0 width=240 height=18 bgcolor="444444">
													<tr>
														<td width=240><font color="009393">       線上管理 </font>[ <font color="LEVEL">0<!--%onlineGM%--></font> ]</td>
													</tr>
												</table>
												<table border=0 cellpadding=0 cellspacing=0 width=240 height=18 bgcolor="000000">
													<tr>
														<td width=240><font color="009393">       遊戲時間 </font>[ <font color="LEVEL">%gameTime%</font> ]</td>
													</tr>
												</table>
												<table border=0 cellpadding=0 cellspacing=0 width=240 height=18 bgcolor="444444">
													<tr>
														<td width=240><font color="009393">       系統時間 </font>[ <font color="LEVEL">%serverTime%</font> ]</td>
													</tr>
												</table>
												<table border=0 cellpadding=0 cellspacing=0 width=240 height=18 bgcolor="000000">
													<tr>
														<td width=240><font color="009393">       登入時長 </font>[ <font color="LEVEL">%serverUpTime%</font> ]</td>
													</tr>
												</table>
											</td>
										</tr>
									</table>

									<!-- 2. 中間分隔線與花紋圖案 -->
									<table border=0 cellpadding=0 cellspacing=0 width=300>
										<tr>
											<td height=12></td>
										</tr>
										<tr>
											<td align="center"><img src="L2UI.SquareGray" width=300 height=1></td>
										</tr>
										<tr>
											<td height=8></td>
										</tr>
										<tr>
											<td align="center"><img src="L2UI_CH3.herotower_deco" width=256 height=32></td>
										</tr>
										<tr>
											<td height=8></td>
										</tr>
									</table>

									<!-- 3. 下方實時在線玩家名單（獨立置中寬框） -->
									<table width=480 bgcolor=111111 border=0 cellspacing=2 cellpadding=6>
										<tr>
											<td align=center><font color="LEVEL">實時在線玩家名單</font></td>
										</tr>
										<tr>
											<td align=center><font color="EEDD82">%onlinePlayers%</font></td>
										</tr>
									</table>
								</td>
							</tr>
						</table>
						<table border=0 cellpadding=0 cellspacing=0 width=555>
							<tr>
								<td height=10></td>
							</tr>
						</table>
						<table border=0 cellpadding=0 cellspacing=0 width=555 background="L2UI_CT1.Windows_DF_TooltipBG">
							<tr>
								<td height=17></td>
							</tr>
							<tr>
								<td align=center><font color=ff5151>L2Town 天堂II</font><font color=009393>-覺醒（暗鴉武士）</font></td>
							</tr>
							<tr>
								<td height=15></td>
							</tr>
						</table>
					</center>
				</td>
			</tr>
		</table>
	</body>
</html>
