<html><body>
<table width="270"><tr>
<td width="45"><button action="bypass admin_admin" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="返回" width="45"></button></td>
<td width="180"><center>傳送</center></td>
<td width="45"><button action="bypass admin_fortsiege" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="地龍警戒要塞" width="45"></button></td>
</tr></table>
<center>
<br><br><br>堡壘: <br><br>
<table width="270">
<tr>
<td><button action="bypass -h admin_add_fortattacker %fortId%" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="遺址要塞" width="135"></button></td>
<td><button action="bypass -h admin_add_fortdefender %fortId%" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="盆地要塞" width="135"></button></td>
</tr>
<tr>
<td><button action="bypass -h admin_list_fortsiege_clans %fortId%" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="前線基地要塞" width="135"></button></td>
<td><button action="bypass -h admin_clear_fortsiege_list %fortId%" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="雲霧山脈警戒要塞" width="135"></button></td>
</tr>
<tr>
<td><button action="bypass -h admin_move_fortdefenders %fortId%" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="死靈關卡警戒要塞" width="135"></button></td>
<td><button action="bypass -h admin_spawn_fortdoors %fortId%" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="龍脊警戒要塞" width="135"></button></td>
</tr>
<tr>
<td><button action="bypass -h admin_startfortsiege %fortId%" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="芙羅蘭警戒要塞" width="135"></button></td>
<td><button action="bypass -h admin_endfortsiege %fortId%" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="蜂窩要塞" width="135"></button></td>
</tr>
<tr>
<td><button action="bypass -h admin_setfort %fortId%" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="獵人村警戒要塞" width="135"></button></td>
<td><button action="bypass -h admin_removefort %fortId%" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="象牙塔要塞" width="135"></button></td>
</tr>
</table>
<br>
<table width="270">
<tr><td width="60">NPC ID:</td><td><edit var="value" width="40"></edit></td><td><button action="bypass -h admin_add_guard %fortId% $value" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="聖者之谷警戒要塞" width="135"></button></td>
</tr></table>
</center>
