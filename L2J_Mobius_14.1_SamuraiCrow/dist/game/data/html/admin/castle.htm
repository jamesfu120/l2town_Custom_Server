<html><body>
<table width="270"><tr>
<td width="45"><button action="bypass admin_admin" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="主頁" width="45"></button></td>
<td width="180"><center>攻城選單</center></td>
<td width="45"><button action="bypass admin_siege" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="返回" width="45"></button></td>
</tr></table>
<center>
<br><br><font color="LEVEL">:    </font><br>
<table width="270">
<tr>
<td align="center" width="140"><button action="bypass -h admin_setsiegetime %castleName%" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="設定攻城時間" width="135"></button></td>
</tr>
</table>
<table width="270">
<tr>
<td align="center" width="135"><button action="bypass -h admin_add_attacker %castleName%" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="增加攻擊者" width="135"></button></td>
<td align="center" width="135"><button action="bypass -h admin_add_defender %castleName%" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="增加守衛者" width="135"></button></td>
</tr><tr>
<td align="center" width="135"><button action="bypass -h admin_list_siege_clans %castleName%" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="血盟列表" width="135"></button></td>
<td align="center" width="135"><button action="bypass -h admin_clear_siege_list %castleName%" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="清除名單" width="135"></button></td>
</tr>
<tr>
<td align="center" width="135"><button action="bypass -h admin_move_defenders %castleName%" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="移動守城方" width="135"></button></td>
<td align="center" width="135"><button action="bypass -h admin_spawn_doors %castleName%" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="召喚城門" width="135"></button></td>
</tr>
<tr>
<td align="center" width="90"><button action="bypass -h admin_startsiege %castleName%" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="開始攻城戰" width="135"></button></td>
<td align="center" width="90"><button action="bypass -h admin_endsiege %castleName%" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="結束攻城戰" width="135"></button></td>
</tr>
<tr>
<td align="center" width="135"><button action="bypass -h admin_setcastle %castleName%" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="給予城堡" width="135"></button></td>
<td align="center" width="135"><button action="bypass -h admin_removecastle %castleName%" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="移除城堡" width="135"></button></td></tr>

</table>
<br>
<table width="270">
<tr><td align="center" width="60">NpcId: 沒有任何問題</td>
<td align="center"><edit var="value" width="40"></edit></td>
<td align="center"><button action="bypass -h admin_add_guard %castleName% $value" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="增加警衛" width="135"></button></td>
</tr></table>
</center>
</body></html>
