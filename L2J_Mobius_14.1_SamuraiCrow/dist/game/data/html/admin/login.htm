<html><title>登入伺服器</title><body>
<table width="270"><tr>
<td width="45"><button action="bypass admin_admin" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="主頁" width="45"></button></td>
<td width="180"><center>伺服器管理選單</center></td>
<td width="45"><button action="bypass admin_admin4" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="返回" width="45"></button></td>
</tr></table>
<br><br>
<table width="240">
<tr>
<td width="100">最大的玩家:</td>
<td><edit height="21" var="qbox" width="120"></edit></td>
<td><button action="bypass admin_html help/login.htm" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="15" value="幫助" width="45"></button></td>
</tr></table><br><br>
<table width="260"><tr>
<td>註冊為:</td><td>%server_name%</td>
</tr><tr>
<td>狀態: </td><td>:    </td>
</tr><tr>
<td>括號: </td><td>最大的玩家 </td>
</tr></table>
<center>
<br><br>
<table width="260"><tr>
<td><button action="bypass -h admin_server_gm_only" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value=" 只有" width="95"></button></td>
<td><button action="bypass -h admin_kick_non_gm" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="沒有 GM 的子" width="95"></button></td>
<td><button action="bypass -h admin_server_all" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="每個人都是" width="95"></button></td></tr><tr>
<td><button action="bypass -h admin_server_list_clock on" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="在時間上" width="95"></button></td>
<td><button action="bypass -h admin_server_list_clock off" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="關閉時間" width="95"></button></td>
<td><button action="bypass -h admin_server_max_player $qbox" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="最大的玩家" width="95"></button></td></tr></table>
</center>
</body></html>
