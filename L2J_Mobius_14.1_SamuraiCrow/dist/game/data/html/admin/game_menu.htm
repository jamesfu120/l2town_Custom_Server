<html><title> 面板</title><body>
<center>
<table bgcolor="444444" border="0" width="270">
<tr>
<td><button action="bypass admin_admin" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="主頁" width="65"></button></td>
<td><button action="bypass admin_admin6" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="角色" width="65"></button></td>
<td><button action="bypass admin_admin2" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="遊戲" width="65"></button></td>
<td><button action="bypass admin_admin7" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="管理" width="65"></button></td>
</tr>
</table><br>
<table width="240">
<tr>
<td>快速輸入框：</td>
<td><edit height="15" var="qbox" width="120"></edit></td>
<td><button action="bypass admin_html help/game_menu.htm" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="20" value="說明" width="45"></button></td>
</tr>
</table>
<br> 血盟相關:<br1>
<table width="240">
<tr>
<td><button action="bypass -h admin_pledge create $qbox" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="20" value="建立" width="82"></button></td>
<td><button action="bypass -h admin_pledge info" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="20" value="資訊" width="82"></button></td>
<td><button action="bypass -h admin_pledge setlevel $qbox" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="20" value="設定等級" width="82"></button></td>
</tr>
<tr>
<td><button action="bypass -h admin_pledge dismiss $qbox" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="20" value="刪除" width="82"></button></td>
<td><button action="bypass -h admin_pledge rep $qbox" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="20" value="聲望 " width="82"></button></td>
<td><button action="bypass -h admin_clan_show_pending" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="20" value="待處理盟主" width="82"></button></td>
</tr>
</table>
<br>關於戰爭:<br1>
<table width="240">
<tr>
<td><button action="bypass -h admin_clanhall" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="20" value="血盟大廳" width="82"></button></td>
<td><button action="bypass -h admin_castlemanage" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="20" value="城堡" width="82"></button></td>
<td><button action="bypass -h admin_fortsiege" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="20" value="要塞" width="82"></button></td>
</tr>
</table>
<br>戰爭相關:<br1>
<table width="240">
<tr>
<td><button action="bypass -h admin_cw_info_menu $qbox" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="20" value="資訊" width="82"></button></td>
<td><button action="bypass -h admin_cw_add $qbox" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="20" value="新增" width="82"></button></td>
<td><button action="bypass -h admin_cw_remove $qbox" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="20" value="刪除" width="82"></button></td>
</tr>
</table>
<br>莊園:<br1>
<table width="125">
<tr>
<td><button action="bypass -h admin_manor" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="20" value="莊園資訊" width="125"></button></td>
</tr>
</table>
<br>格拉西亞種子:<br1>
<table width="125">
<tr>
<td><button action="bypass -h admin_gracia_seeds" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="20" value="格拉西亞資訊" width="125"></button></td>
</tr>
</table>
<br>大型首領:<br1>
<table width="125">
<tr>
<td><button action="bypass -h admin_grandboss" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="20" value=" 大型首領資訊" width="125"></button></td>
</tr>
</table>
<br>奧林匹亞:<br1>
<table width="125">
<tr>
<td><button action="bypass -h admin_checkolympiad" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="20" value="檢查奧林匹亞" width="125"></button></td>
<td><button action="bypass -h admin_saveolymp" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="20" value="儲存奧林匹亞" width="125"></button></td>
</tr>
</table>
<br>英雄:<br1>
<table width="250">
<tr>
<td><button action="bypass -h admin_sethero" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="20" value="設定英雄" width="100"></button></td>
<td><button action="bypass -h admin_givehero" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="20" value="給予未領取的英雄" width="150"></button></td>
</tr>
</table>
<br>
