<html><title>帳戶詳細: </title><body>
<center>
<table width="270"><tr>
<td width="45"><button action="bypass admin_admin" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="主頁" width="45"></button></td>
<td width="180"><center>帳號: %account% </center></td>
<td width="45"><button action="bypass admin_character_info %player%" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="返回" width="45"></button></td></tr>
</table><br>
<table width="270">
<tr>
<td>引數:</td>
<td><edit height="15" var="qbox" width="100"></edit></td>

<td><button action="bypass -h admin_character_info %player%" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="20" value="返回" width="40"></button></td>
</tr>
</table>
<br><br>
<table width="270">
<tr>
<td><button action="bypass -h admin_ban_acc %account%" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="20" value="封鎖帳號" width="90"></button></td>
<td><button action="bypass -h admin_unban_acc %account%" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="20" value="解除封鎖" width="90"></button></td>
<td><button action="bypass -h admin_account_level %account% $qbox" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="20" value="設定權限" width="90"></button></td>
