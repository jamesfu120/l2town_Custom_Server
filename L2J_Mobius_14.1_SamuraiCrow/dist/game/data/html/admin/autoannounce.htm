<html><body>
<table width="270"><tr>
<td width="45"><button action="bypass admin_admin" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="主頁" width="45"></button></td>
<td width="180"><center>自動公告 選單</center></td>
<td width="45"><button action="bypass admin_admin7" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="返回" width="45"></button></td>
</tr></table><br><br>
<center>新的自動公告:</center><br>
<table width="270"><tr>
<td>::</td>
<td><edit var="autoann_initial" width="50"></edit></td>
</tr><tr>
<td>公告：:</td>
<td><edit var="autoann_delay" width="50"></edit></td>
</tr><tr>
<td>重複次數〔-1為無限次〕</td>
<td><edit var="autoann_repeat" width="50"></edit></td>
</tr><tr>
<td>批判性:</td>
<td><combobox list="false;true" var="autoann_critical" width="50"></combobox></td>
</tr><tr>
<td>內容：</td></tr></table>
<multiedit height="50" var="autoann_memo" width="250"><br>
<center><table><tr>
<td><button action="bypass -h admin_add_autoann $autoann_initial $autoann_delay $autoann_repeat $autoann_critical $autoann_memo" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="新增公告" width="70"></button></td>
<td><button action="bypass -h admin_reload_autoann" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="重新讀取" width="70"></button></td>
</tr></table></center>
<br>
%announces%
</multiedit></body></html>
