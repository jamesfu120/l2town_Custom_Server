<html><title>召喚管理</title><body>
<center>
<table width="270"><tr>
<td width="45"><button action="bypass admin_admin" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="主頁" width="45"></button></td>
<td width="180"><center><button action="bypass admin_show_npcs" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="15" value="召喚選單" width="70"></button></center></td>
<td width="45"><button action="bypass admin_spawn" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="返回" width="45"></button></td>
</tr></table><br>
召喚 NPC/怪物 ID：永久或暫時<font color="LEVEL"> [*]</font><br1>
<table width="270"><tr>
<td width="90">ID/數量：</td>
<td width="60"><edit height="15" var="id" width="60"></edit></td>
<td width="15"><edit height="15" var="qty" width="15"></edit></td>
<td width="45"><button action="bypass -h admin_spawn_monster $id $qty" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="15" value="永久" width="45"></button></td>
<td width="45"><button action="bypass -h admin_spawn_once $id $qty" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="15" value="暫時" width="45"></button></td>
</tr></table><br>
【 特別的 】<br1>
<table width="270">
<tr>
<td><button action="bypass -h admin_spawn_reload" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="20" value="重新讀取" width="90"></button></td>
<td><button action="bypass -h admin_unspawnall" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="20" value="移除所有 NPC" width="90"></button></td>
<td><button action="bypass -h admin_respawnall" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="20" value="重新召喚 NPC" width="90"></button></td>
</tr>
<tr>
<td><button action="bypass -h admin_spawnnight" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="15" value="夜晚型" width="90"></button></td>
<td><button action="bypass -h admin_spawnday" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="15" value="白天型" width="90"></button></td>
<td></td>
</tr>
</table>
</br1></br1></center><br>[*]: 名字是不對案例的,但你必須使用凸點而不是空格.<br>如果你不需要超過一群暴徒,你可以讓qty欄位空. </body></html>
