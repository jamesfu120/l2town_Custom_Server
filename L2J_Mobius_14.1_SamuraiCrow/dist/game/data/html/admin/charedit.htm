<html><title>編輯  </title><body>
<table width="260"><tr>
<td width="40"><button action="bypass admin_admin" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="主頁" width="40"></button></td>
<td width="180"><center>編輯  <font color="LEVEL">%name%</font></center></td>
<td width="40"><button action="bypass admin_character_info %name%" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="返回" width="40"></button></td>
</tr></table>
<br>
<table width="270">
<tr><td fixwidth="90">HP:  / </td><td fixwidth="90">國會議員: /</td><td fixwidth="90">CP: /</td></tr>
<tr><td width="90">名聲: </td><td width="90">PvP:  </td><td width="90"> PK: </td></tr>
<tr><td width="90">負載量: </td><td width="90"> / </td><td width="90">()  </td></tr>
<tr><td width="90">班級: </td><td>%class%</td><td width="90">AccLv:  </td></tr>
<tr><td width="90">::</td><td>%noblesse%</td></tr>
</table>
<br>
<table width="270">
<tr><td width="140">姓名:</td><td><edit var="name" width="80"></edit></td><td><button action="bypass -h admin_changename $name" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="儲存 儲存" width="45"></button></td></tr>
<tr><td width="140">姓名顏色:</td><td><edit var="color" width="80"></edit></td><td><button action="bypass -h admin_setcolor $color" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="設定 設定" width="45"></button></td></tr>
<tr><td width="140">標題:</td><td><edit var="title" width="80"></edit></td><td><button action="bypass -h admin_settitle $title" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="儲存 儲存" width="45"></button></td></tr>
<tr><td width="140">標題顏色:</td><td><edit var="tcolor" width="80"></edit></td><td><button action="bypass -h admin_settcolor $tcolor" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="設定 設定" width="45"></button></td></tr>
<tr><td width="140">推薦:</td><td><edit var="reco" width="80"></edit></td><td><button action="bypass -h admin_rec $reco" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="儲存 儲存" width="45"></button></td></tr>
<tr><td width="140">接入水平:</td><td><edit var="acc" width="80"></edit></td><td><button action="bypass -h admin_changelvl $acc" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="儲存 儲存" width="45"></button></td></tr>
<tr></tr>
<tr><td width="140"><button action="bypass -h admin_setnoble" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="沒有貴族" width="65"></button></td><td><button action="bypass -h admin_setclass" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="班級 班級" width="45"></button></td><td><button action="bypass -h admin_setsex" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="關於性 的相關搜尋" width="45"></button></td></tr>
</table>
<br>
<table width="270">
<tr>
<td width="10">HP: 沒有任何問題</td>
<td>
<edit var="hp" width="50">
</edit></td>
<td>
<button action="bypass admin_set_hp $hp" back="L2UI_CH3.shortcut_rotate_down" fore="L2UI_CH3.shortcut_rotate" height="16" value=" " width="16">
</button></td>
<td width="50">PvP 旗: </td>
<td>
<button action="bypass admin_set_pvp_flag" back="L2UI_CH3.shortcut_rotate_down" fore="L2UI_CH3.shortcut_rotate" height="16" value=" " width="16">
</button></td>
</tr>
<tr>
<td width="10">國會議員:</td>
<td>
<edit var="mp" width="50">
</edit></td>
<td>
<button action="bypass admin_set_mp $mp" back="L2UI_CH3.shortcut_rotate_down" fore="L2UI_CH3.shortcut_rotate" height="16" value=" " width="16">
</button></td>
<td width="10">PvPs:</td>
<td>
<edit var="pvpkills" width="50">
</edit></td>
<td>
<button action="bypass admin_setpvp $pvpkills" back="L2UI_CH3.shortcut_rotate_down" fore="L2UI_CH3.shortcut_rotate" height="16" value=" " width="16">
</button></td>
</tr>
<tr>
<td width="10">CP:  這就是我的意思</td>
<td>
<edit var="cp" width="50">
</edit></td>
<td>
<button action="bypass admin_set_cp $cp" back="L2UI_CH3.shortcut_rotate_down" fore="L2UI_CH3.shortcut_rotate" height="16" value=" " width="16">
</button></td>
<td width="10">這裡的PKs:</td>
<td>
<edit var="pkkills" width="50">
</edit></td>
<td>
<button action="bypass admin_setpk $pkkills" back="L2UI_CH3.shortcut_rotate_down" fore="L2UI_CH3.shortcut_rotate" height="16" value=" " width="16">
</button></td>
</tr>
</table>
<br>
</body>
</html>
