<html><title>專案 專案</title><body>
<table width="270">
<tr>
<td width="45"><button action="bypass admin_admin" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="主頁" width="45"></button></td>
<td width="180"><center>建立專案選單</center></td>
<td width="45"><button action="bypass admin_admin" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="返回" width="45"></button></td>
</tr>
</table><br>
<table width="260"><tr><td>在專案-id中填寫ID號碼,以建立您想要的專案,如果您需要多個專案,請使用數量. <font color="LEVEL">警告:不要使用量量與非可堆積物品</font></td></tr></table><br>
<center>
<table width="270">
<tr>
<td>物品-ID:</td>
<td>數量:</td>
<td></td>
</tr>
<tr>
<td><edit var="itemid" width="50"></edit></td>
<td><edit type="number" var="itemnum" width="70"></edit></td>
<td><button action="bypass -h admin_create_item $itemid $itemnum" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="此分類下一篇: 產品 建立" width="140"></button></td>
</tr>
<tr><td></td><td></td><td><button action="bypass -h admin_give_item_target $itemid $itemnum" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="給目標的專案" width="140"></button></td></tr>
<tr><td></td><td></td><td><button action="bypass -h admin_give_item_to_all $itemid $itemnum" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="在網路上給所有的人提供物品" width="140"></button></td></tr>
</table><br><br>
<table cellpadding="4" width="270">
<tr>
<td>硬幣：</td>
<td><combobox height="17" list="Adena;AncientAdena;FestivalAdena;BlueEva;GoldEinhasad;SilverShilen;BloodyPaagrio;FantasyIsleCoin" var="ebox" width="120"></combobox></td>
</tr>
<tr>
<td>數量:</td>
<td><edit height="12" type="number" var="vbox" width="120"></edit></td>
</tr>
<tr>
<td></td>
<td><button action="bypass -h admin_create_coin $ebox $vbox" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF" height="21" value="硬幣 建立建立" width="140"></button></td>
</tr>
</table>
</center>
</body></html>
