	異常視覺效果是由某些遊戲中的視覺效果決定的特殊狀態，例如眩暈、睡眠或定身。<br>
	正常情況下，技能落地將決定某個角色是否必須出現異常狀態。<br>
	從〔異常視覺效果〕選單中，您可以在選定目標或特定半徑值上開啟或關閉任何異常。<br>
