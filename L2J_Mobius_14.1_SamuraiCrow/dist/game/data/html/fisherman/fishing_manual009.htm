<html><body>釣魚初學者導覽<br>將釣到的漁獲帶到釣魚公會，就能換取實用的道具。<br>
<font color="LEVEL">醜陋的魚</font>與<font color="LEVEL">敏捷的魚</font>可以交換<font color="LEVEL">鮮魚湯</font>、頭飾或變身卷軸。<font color="LEVEL">強壯的魚</font>可以交換<font color="LEVEL">艾爾シウム粉末</font>，至於<font color="LEVEL">其他的魚則可以直接賣給商店</font>。<br>
如果你獲得了艾爾シウム粉末，釣魚公會也會教你如何使用它。要怎麼處理這些漁獲，全由你自己決定！<br>
