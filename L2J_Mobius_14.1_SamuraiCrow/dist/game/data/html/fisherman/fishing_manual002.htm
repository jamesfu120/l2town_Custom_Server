<html><body>釣魚初學者導覽<br>
在開始釣魚之前，你應該先找到合適的釣點。找到這樣的釣點後，你會在螢幕右側看到釣魚按鈕。<br>
請務必學會如何釣魚！釣魚需要一 <font color="LEVEL">釣竿</font> 以及 <font color="LEVEL">誘餌</font> 您也可以在自動模式下使用浮標：釣魚時將自動使用。<br>
