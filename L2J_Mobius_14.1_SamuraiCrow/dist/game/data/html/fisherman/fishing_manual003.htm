<html><body>釣魚初學者導覽<br>
只要是魚群聚集、適合垂釣的水域，都可以作為釣魚場。<br>
適合釣魚的地點如下：<font color="LEVEL">伊娃的水底庭園</font>（或<font color="LEVEL">愛麗絲湖</font>）、競技場所在的<font color="LEVEL">納爾瑟爾湖</font>、<font color="LEVEL">奇岩港口</font>、<font color="LEVEL">蜥蜴草原</font>周邊、<font color="LEVEL">古魯丁城鎮</font>水邊、<font color="LEVEL">中立地帶</font>、<font color="LEVEL">海音斯</font>、<font color="LEVEL">帕爾梅湖</font>、<font color="LEVEL">奇岩城鎮的橋上</font>，以及<font color="LEVEL">亞丁城鎮內</font>。<br>
