技能有幾種強化選項：強化、祝福強化、反轉，以及強化技能路徑。<br>
<center><font color="LEVEL">技能強化</font></center><br1>
此強化方法需消耗 1 本【巨獸上等典籍】及部分金幣。若強化失敗，強化等級將重置為零。<br>
<center><font color="LEVEL">祝福強化</font></center><br>
此方法需要1 <font color="LEVEL">巨人的優秀法典：精通</font> 且為一般技能強化所產生的金幣數量的五倍。若你的嘗試失敗，強化值將保留，使這成為強化高強化技能相對安全的方法。<br>
<center><font color="LEVEL">回歸</font></center><br>
此選項需要 1 <font color="LEVEL">巨人的上古法典：遺忘</font>，並逐漸將技能強化等級降低一級。若在技能等級為 Lv. 1 時使用，技能將重置為零。<br>
<center><font color="LEVEL">強化路徑更改</font></center><br>
此功能會更改施加於技能上的強化型別。除 <font color="LEVEL">巨人的優秀法典：紀律</font>此程式需消耗下一個強化等級所需金幣的20%。
