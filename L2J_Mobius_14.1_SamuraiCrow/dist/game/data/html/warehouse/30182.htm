<html><body>倉庫管理員克裡弗：<br>
歡迎，歡迎！您有沉重的物品嗎？太多行李了嗎？那就把它們留下吧。<br>
相信我，這可是世界上最安全的倉庫之一，因為它屬於矮人銀行協會。只要說一句話，我便會為你帶來你所要求的東西；或者，如果你希望，我也可以直接拿走。你肯定會喜歡我們的服務！你不必為你的財物擔憂。歷史中曾發生過許多戰爭：從古代神明與巨人之間的戰爭，到最近與艾爾莫爾的戰爭。但你有聽過矮人倉庫發生盜案嗎？我相信你從未聽過！<br>
