<html><body>倉庫管理員羅帝克：<br>
你好，冒險家！歡迎來到象牙塔。請將你的物品放在此處，然後去遊覽吧。你現在在一樓。在更高的樓層有各種公會——專為神秘學者、巫師、魔導師設立。我們的塔幾乎就是由巫師為其他巫師所建立的巫師聚居地。<br>
很久以前，在艾爾莫登帝國的時代，象牙塔的權力與影響力無人能及。巫師們本可掌控整個大陸，他們真的這麼希望過嗎……<br>
