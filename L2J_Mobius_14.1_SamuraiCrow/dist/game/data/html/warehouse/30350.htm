<html><body>倉庫 倉庫管理員 卡爾雷因：<br>
黑暗精靈村的狀況如何？我為他們感到擔憂。那些黑暗精靈已經與希利恩的惡獸戰鬥了……如今，我們甚至無法靠近村莊去檢視他們的狀況。太危險了。是的，在這種時候，充足的糧食儲存變得非常重要。你永遠不知道我們的城鎮是否會被深邃黑暗沼澤中那些兇惡、流著口水、紅眼的生物包圍……呃……對不起。如果你的揹包空間不足，可以將物品交給我。我的倉庫對入侵者、火災、魔法攻擊和黴菌都有良好的防禦。<br>
