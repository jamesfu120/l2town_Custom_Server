<html><body>哨兵克裡斯汀：<br>
當我族深居地下以避陽光時，四重統治者維廖爾曾對那些稱為格雷姆林的低等生物進行各種實驗，並創造出一種新種族，稱為小鬼。<br>
此奴隸種族由黑魔法之力所創造。他們擁有細長尖爪，能在黑暗中感知道路，並擁有翅膀，可飛行，從洞穴壁或天花板上採集蘑菇與苔蘚，或從深礦中採集礦物。<br>
他們尊崇我們的名號，為我們忠誠效力數百年。然而，他們 somehow 破除了束縛的咒語，殺死了自己的監督者，並逃脫了。當時我們正與光明族的精靈戰爭，因此無法對此採取任何行動。<br>
他們如何解除四賢者的咒語尚不清楚，但有人懷疑某些小妖精懂得使用魔法。我難以相信如此原始的種族能學會魔法。<br>
