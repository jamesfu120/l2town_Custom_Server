<html><body>守衛馬克西斯：<br>
你好，你打算去詠唱谷狩獵嗎？如果你打算去，就沿著前方的路走吧。許多人都來往於詠唱谷，你可以跟隨他們。山谷的入口看起來像瀑布，如果你進入，就會連線到山谷內部。<br>
拜侖在那邊是當地人，對山谷非常熟悉。他說那裡景色相當美麗，但也有危險的生物棲息其中。<br>
