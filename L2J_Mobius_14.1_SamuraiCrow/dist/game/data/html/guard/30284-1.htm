<html><body>哨兵騎士艾貝裡烏斯：<br>
哨兵亦稱森林守護者，或新綠守望者。我們是戰士，已為精靈森林守護數百年，抵禦外來威脅。霧山的獸人、貪婪的人類妄圖擴張領土，以及我們北方黑暗精靈兄弟——皆曾多次進攻此地。每次我們自衛，他們便學到一課：低估哨兵將付出沉重代價。<br>
昔日村莊四周曾設定許多哨兵，不僅限於村莊周圍，亦在森林邊界設立瞭望哨。然而，如今哨兵數量已少於一百人，因此我們只能依賴於 <font color="LEVEL">守護者</font> 以守護村莊外的森林。<br>

</body></html>
