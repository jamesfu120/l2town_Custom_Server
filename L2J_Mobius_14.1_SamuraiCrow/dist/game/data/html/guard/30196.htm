<html><body>牟恩上尉：<br>
歡迎來到歐瑞，年輕的旅人！我叫牟恩，為大師效勞，並維持歐瑞的秩序。<br>
歐瑞要求採取更嚴格的安全措施，因為它位於亞丁的敵人艾爾莫爾附近。這些措施可能會帶來一些不便，但我們希望您能理解。<br>
這些地方靠近北方邊境，許多當地居民在習俗和生活方式上與艾爾莫的人有很多相似之處。伐木工人其實並不在乎自己如此接近邊境。我們中很少有人在艾爾莫有親友，哈哈！<br>
這座位於北山的高塔是歐瑞城堡。每當我望見它，我都祈禱我的人民能安居樂業，艾爾莫的人民能體會這座防禦工事的堅固。<br>
