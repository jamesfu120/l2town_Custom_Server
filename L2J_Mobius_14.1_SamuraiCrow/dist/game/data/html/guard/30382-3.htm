<html><body>守衛雷坎：<br>
當戰爭爆發時，無法逃往古魯丁城堡的人們都聚集到伯妮斯村。他們雖然能抵擋侵略者的攻擊，因為村莊擁有石牆外圍。遭受連番退卻的領主部隊，以村莊為據點部署陣地。艾恩哈薩德的神職人員，負責治療傷員者，也留在村莊。<br>
部隊曾數次擊退格拉西安軍的進攻，並開始希望村民能活下來。然而，這無濟於事。格拉西安軍已與奧爾馬胡姆的外國部隊結盟。這些暴虐的變質者攻破外牆，蜂擁進入村莊，屠殺士兵、祭司、農夫以及所有在場的人。他們還將所有建築點燃。<br>
伯妮斯一夜之間化為焦土廢墟，那些被殺害的人仍以靈魂之姿留存，充滿了仇恨與報復。<br>
