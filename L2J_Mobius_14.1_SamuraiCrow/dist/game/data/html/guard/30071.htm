<html><body>船長盧卡斯：<br>
歡迎！我很開心在狄恩見到你。我叫盧卡斯，負責這裡的安全。這是你第一次來狄恩嗎？我不知你為何來到我們的土地，但我想說，這裡是一個平靜安寧的地方。請在村莊裡不要惹事生非。<br>
但一旦你離開村莊，就會面臨許多危險。在外面最好不要孤身一人。<br>
