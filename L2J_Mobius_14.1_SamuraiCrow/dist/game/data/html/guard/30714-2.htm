<html><body>守衛派洛司：<br>
瀑布自失落高原奔流而下，高過雲層，為大陸上最高的瀑布。傳說此瀑布乃神力所造……傳說中，一隻兇猛生物的巢穴隱藏於瀑布之中。<br>
該生物假扮人類，吞噬毫不知情的路人……幾年前，一隊搜救人員進入瀑布尋找失蹤者，僅有一名牧師返回。他也於不久後身亡，死前說出「zahak」。<br>
我不知道那代表什麼……可能是怪物的名字吧？不管如何，聽完那個詞語後，許多魔法師都嚇得面色蒼白。但大魔法師悄悄對他們說了什麼，他們全都保持沉默。<br>
