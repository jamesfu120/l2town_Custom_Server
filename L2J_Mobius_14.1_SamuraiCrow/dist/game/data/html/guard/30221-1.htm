<html><body>哨兵萊伊吉恩：<br>
若你跨越此橋，沿西南方向行進，將會經過被遺棄的地下要塞與中立區，並抵達人類所稱的古魯丁之地。<br>
古魯丁是亞丁人國中最大的地區。然而，幾年前，來自海外的另一個稱為格拉西亞的人國曾攻擊此地，導致該地區部分割槽域焚燬。自歷史開始以來，人類總是以這種殘酷戰爭的方式爭奪領土。<br>
戰爭已使古魯丁留下許多廢墟，這些廢墟已成為被亡靈盤踞的危險之地。此外，南方廣袤的荒原中隱藏著胡德昆蟲。因此，若您決定前往那裡，出發前務必做好充分準備。<br>
