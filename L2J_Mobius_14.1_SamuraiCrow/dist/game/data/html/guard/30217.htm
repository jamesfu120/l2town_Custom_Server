<html><body>哨兵貝裡奧斯：<br>
我希望你在我們湖畔度過愉快的時光。我的名字是貝裡奧斯，我守護這片森林與世界樹。<br>
當我年輕時，我曾遍遊各地，幾乎走遍了世界的每個角落。我可以肯定地告訴你：每一個地方都有值得觀看之處，但我們的精靈村，卻是其中最美麗的。<br>
