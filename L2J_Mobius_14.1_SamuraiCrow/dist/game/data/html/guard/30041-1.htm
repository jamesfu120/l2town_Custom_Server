<html><body>守衛阿諾德：<br>
在亞丁統一戰爭期間，賽德裡爵士效忠於王 Raoul，於戰場上立下赫赫功績。他一生秉持騎士精神與艾因哈薩德的意志，是國中所有年輕戰士的榜樣，亦是活生生的傳說。<br>
當王國統一完成時，國王拉烏爾突然去世。爵士賽德裡宣佈退休，來到說話之島，並建造訓練廳以教導年輕人。然而，自那以後他的健康狀況逐漸惡化，現居於亞丁城堡。訓練廳現由他的侄子爵士羅伊恩管理。<br>
