<html><body>黑匠博林: 首<br>歡迎來到!我是黑工會的黑工會長Bolin 在蘇格拉特. 在我和你結束之後,我的男孩,你將是工會的偉業和威望的活著證據.<br>記住,對我們來說,工藝不只是一種職業 - - 這是我們人生的目的. 它也是我們最大的力量,是如此強大的力量,沒有人能忽略它.<br>讓其他種族誇耀自己的軍隊;我們知道他們的驕傲真的是多麼虛空.他們怎麼能在沒有我們所創造的高龍,武器和盔甲的情況下打仗或躺在堡壘上呢?即使是他們的最偉大的戰士也就像沒有我們的勞動的新生兒一樣無助.<br>記得這麼好,年輕人,技巧比拿刀或 cast some magic spell 更重要.<br>
