<html><body>頭鐵匠奧皮斯：<br>
我是狄恩黑鐵鍛造公會的總鍛造師奧皮斯。誠實地說，沒有黑鐵鍛造公會，人類文明仍將處於非常原始的狀態。你認為各族能出征戰爭或圍攻敵方城池而不依靠我們嗎？絕對不可能！沒有我們的攻城高崙與武器，戰士們只能被迫以木棍石頭對抗鋼鐵。他們會看起來多麼可笑啊！<br>
啊，但我不意要勸導你。對不起。那你來的目的是什麼？<br>
