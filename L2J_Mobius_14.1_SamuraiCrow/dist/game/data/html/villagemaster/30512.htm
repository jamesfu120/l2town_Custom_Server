<html><body>頭鐵匠庫斯吐：<br>
你好啊，陌生人！我是黑鐵砧公會的總裁庫斯吐。我們這群人非常可靠。與那些鋼門公會的成員不同，我們的公會不僅僅追求利潤，更享受用幾枚黃金創造出美麗事物的喜悅。將美與快樂帶入光明的能力，這可是一門值得追求的技能！<br>
那麼，朋友，你為什麼來到我的鐵匠鋪呢？我樂意提供我所能給予的幫助。<br>
