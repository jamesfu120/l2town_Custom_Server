<html><body>附魂及其危險：<br>
此技術涉及專注於一具亡靈，並將其接收至自身體內。然而，這也意味著必須放棄與亡靈溝通的自由，並將被進入體內的亡靈所束縛。<br>
 無咒術士、戰狂或亡靈將存在。它將化為一體兇猛生物。六個高貴的獸人部族非常清楚這一點！<br>
然而，若某些愚昧的咒術士無法抗拒誘惑，而讓自己被附身，則必須將其與附身之物分離。被附身者，即咒術士，將失去生命，其靈魂將被死靈吞噬。在這種情況下，這才是唯一的解決方案。<br>
<font color="LEVEL"> 首先，對被附身的目標施加強大影響，例如暈眩。</font><br>
<font color="LEVEL"> 然後使用魔法吸乾他所有的血液，例如「偷取精魄」，以盡量削弱靈魂的佔有。 </font><br>
一旦佔有解除，被佔有者死亡，死者的靈魂便恢復自由。</body></html>
