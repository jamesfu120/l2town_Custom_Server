<html><body>召喚師奇茲研究期刊：<br>
沙基爾以稱為「荊棘王冠」的魔法力場保護自己。這種魔法消耗極其巨大，無法長時間維持。為了延緩對手的進攻，他必須不斷重新啟用此魔法。<br>
荊棘王冠讓夏基爾對魔法具有極高的抵抗力。更令人不安的是，當荊棘王冠啟動時，任何攻擊他之舉都會反彈回攻擊者身上。<br>
沙基爾與其他天使長舒瑞爾及貝拉凱爾同級。即使高階法魔也無法在無高階卡特協助下制服他。然而，當王冠生效時，召喚者必須下令停止攻擊，否則將因反彈而受傷。若發生此情況，所有攻擊必須中止，直到荊棘王冠的效應耗盡。<br>
