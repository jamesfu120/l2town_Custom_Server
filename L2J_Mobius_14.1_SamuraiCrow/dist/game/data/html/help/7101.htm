<html><body>附魂及其危險：<br>
 戰狂與亡靈溝通。戰狂的儀式包含來自杜達-馬拉、赫斯圖、甘迪等部落的剛剛離世的靈魂，以及祖先的靈魂。後者包括自遠古以來的獸人、著名靈魂如火焰領主帕格裡奧，以及各土地原生靈魂的力量。這些靈魂皆依當前需求被選拔並加以運用。<br>
偶爾，低等級的獸人統治階層為了獲得巨大權力而犯下禁忌行為。<br>
此禁術稱為「魂魄附體」。<br>
