<html><body>對比爾歌曲的批判：<br>
<font color="LEVEL">古詩人與現代歌手</font><br>
 比爾是精靈族中出過的最出色的劍術詩人。她是女王最喜愛的歌手，甚至曾為西哈演唱過。<br>
然而，在現代語境中，我們不能忽視她歌曲所蘊含的魔力。在她那個時代，歌曲是對神明的讚頌，因此歌曲具有如埃娃般的權威。在人類時代 dawn 之後，歌曲主要演變為娛樂的手段。<br>
 劍術詩人的歌曲也是如此。一位獨自邊唱邊揮劍的劍術詩人，完全明白觀眾的重要性。<br>
