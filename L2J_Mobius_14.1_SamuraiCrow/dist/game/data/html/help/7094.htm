<html><body>世界樹護衛日誌：<br>
<font color="LEVEL">世界樹守護者所隱藏的精靈秘聞</font><br>
世界樹的守護者並非易事。<br>
持續的緊張耗盡了他們的鎮定，因此他們將情感掩藏在面具之後。<br>
他們的挫折感表現為對其他所有民族的殘酷仇恨。他們無可救藥地懷抱著懷疑與悲觀的態度。<br>
他們經常誤解護衛之生命的祭禮犧牲。<br>
