<html><body>背叛者穆哈克之記：<br>
<font color="LEVEL">在拉坎的情況下</font>當他被降職為縣令時，穆哈克——長期被認為是阿圖巴部族中最出色的碎裂者——前往蘭坎求師，成為其弟子，並不足為奇。<br>
拉坎全心投入訓練穆哈克。經過艱苦的訓練，穆哈克的能力呈指數級增長，但他的臉上卻流露出敗績的神情。這種態度，可能是導致穆哈克背叛的最大原因。<br>
