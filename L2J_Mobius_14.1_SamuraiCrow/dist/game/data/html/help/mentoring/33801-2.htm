<title>導師手冊</title>
<button action="bypass -h player_help 33801.htm" align="LEFT" icon="NORMAL">清單</button>
<br>
嚮導可同時擁有最多三位被指導者。每次被指導者升級時，嚮導將收到「被指導者的標記」郵件。<br>
在等級1至50之間，嚮導每10級會收到一封信。等級超過50後，每當學徒升級，嚮導都會收到一封信。請務必刪除不必要的郵件，因為若郵箱已滿，將無法接收新郵件。 <br>
當導師與學徒皆線上時，導師可獲得強力的能力提升增益，並獲得學徒的經驗值、精氣值及額外增益。<br>
當學員完成覺醒或第三種解脫時，他將自動畢業並透過郵寄獲得學員證書。若他將證書帶至嚮導處，嚮導會以該證書兌換證書，可用於購買各種物品。<br>
若嚮導與被嚮導提前終止合約，嚮導須等待兩天以尋找另一名被嚮導。若被嚮導畢業，嚮導須等待一天以尋找另一名被嚮導。<br>
