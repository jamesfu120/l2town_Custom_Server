<title>導師手冊</title>
<button action="bypass -h player_help 33801.htm" align="LEFT" icon="NORMAL">清單</button>
<br>
若您符合嚮導資格，請選擇一位角色成為您的被嚮導。然後，點選「好友管理/嚮導」下方的[+]按鈕，輸入您希望成為被嚮導的角色名稱。當對方同意時，您便擁有了一位被嚮導。<br>
若您等級為84或更低，或尚未經歷覺醒或第三解放，您亦可成為被指導者。<br>
若您對您的嚮導或被嚮導不滿，您可以終止嚮導/被嚮導關係。請在好友管理員/導師功能中選擇適當的目標，並按下 [-] 按鈕。<br>
