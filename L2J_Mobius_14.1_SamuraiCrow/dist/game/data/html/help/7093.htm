<html><body>腐敗騎士之形：<br>
<font color="LEVEL">阿迪爾，那位貪腐騎士的故事。</font><br>
騎士必須內在理解並為捍衛榮譽而戰。每位騎士都擁有一樣聖潔且深藏於心之物。這可能是榮譽、一座莊園，或一位美麗的女士！<br>
但惡徒阿迪爾只關心榮耀與勝利，特別是透過個人勝利來實現自己的榮耀！因此，他渴望被稱為全境最強大的騎士。他從未被擊敗！然而，最終他的貪婪卻導致了他的毀滅。他拋棄了騎士的榮譽，並犧牲了他所誓約保護的村民的生命！<br>
