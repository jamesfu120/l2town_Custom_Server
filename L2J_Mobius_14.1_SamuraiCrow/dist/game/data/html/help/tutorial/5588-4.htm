<font color="LEVEL">雷達</font><br>
雷達上的紅點表示您目前的位置，雷達邊緣的黃點則是NPC為您指定的目標點。<br>
雷達上的字母 N 表示北方。更改角色的朝向會同時旋轉雷達。因此，角色所面對的方向將始終位於雷達的頂部。<br>
