<font color="LEVEL">死亡</font><br>
當等級5或以上角色死亡時，其經驗值（Exp）將部分減少，且除當前裝備的武器外，其他物品也可能掉落。<br>
等級4或以下且從未殺死其他玩家的角色並非如此。但等級5或以上角色死亡時，其經驗分數（Exp）將會減少，請謹慎行事。<br>
此外，若角色的因果值為0（您可在狀態視窗中檢視因果值，按Alt+T），或在戰鬥（PvP）中被另一角色擊殺且該角色的PK值為5或以下，則該角色不會掉落任何道具。<br>
