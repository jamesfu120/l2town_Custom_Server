<font color="LEVEL">任務物品</font><br>
在NPC指派下擊殺怪物後，您偶爾會收到任務道具作為證據。這些道具不會掉落在地，但您會聽到一聲輕微的聲音，並會自動加入您道具欄的任務區。請點選道具欄中的「任務」標籤（按 Tab 或 Alt+V）來檢視您的任務道具。要檢視目前正在進行的任務或任務道具清單，請點選螢幕右下角的「任務資訊」按鈕，再選取「任務」標籤（ALT+U）。<br>
