<font color="LEVEL"> 新角色獎勵</font><br>
每一個字都 <font color="LEVEL">等級 25</font> 被視為「新字」。所有新字均享有以下優勢：<br>
<font color="LEVEL"> 交換裝備</font><br>
裝備可於武器、防具及配件商店以支付價差的方式兌換。所有無等級裝備均可以此方式兌換。<br>
<font color="LEVEL"> 輔助魔法</font><br>
每個村莊的導覽員都會為新角色施放匹配其等級的輔助魔法強化。等級介於10至24之間的新角色，將根據其等級施放不同的輔助魔法強化。<br>
<font color="LEVEL"> 額外任務獎勵</font><br>
在各項任務中，新角色將獲得額外獎勵。<br>
