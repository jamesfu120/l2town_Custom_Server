<font color="LEVEL">金幣與物品</font><br>
殺死怪物後，通常會掉落該怪物所持有的道具或金幣。將游標移至道具或金幣上，它會變成手形圖示，讓您可拾取。只需點選即可拾取。您所收集的道具可在道具欄（按鈕或按 Alt+V）中檢視。<br>
