<font color="LEVEL">觀點 (POV)</font><br>
按住右鍵滑鼠並移動滑鼠，可改變角色的視角。這種靈活的視角切換在狩獵時尤為有用，因為角色必須環顧四周搜尋怪物。<br>
再次點選右鍵滑鼠，預設的視角將會恢復。<br>
按下頁面向上/向下鍵，也可讓你更改角色的基本視角。<br>
