<font color="LEVEL">滑鼠功能</font><br>
向下滾動滑鼠滾輪會放大，向上滾動則會縮小。請注意，你只能放大或縮小到一定程度。<br>
點選滑鼠滾輪按鈕，會將你的視角（POV）調整為面向角色前方；再次點選則會恢復至預設視角。此功能在你被怪物追擊或需要維持隊伍合併時特別有用。<br>
您也可以使用鍵盤上的頁面向上和頁面向下鍵來放大或縮小。<br>
