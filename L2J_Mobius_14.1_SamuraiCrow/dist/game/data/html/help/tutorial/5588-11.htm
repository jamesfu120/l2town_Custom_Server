<font color="LEVEL">偷跑哥布林註冊</font><br>
您可以將最愛的技能、動作、裝備和物品註冊到快捷鍵視窗中。這將有助於戰鬥中更有效率地使用，讓遊戲體驗更加刺激。<br>
按 ALT+F1~F12 或點選快捷鍵視窗中的其中一個圖示，可直接跳轉至另一組快捷鍵的適用快捷鍵列。若您需要註冊多個快捷鍵，將它們分組至不同的快捷鍵視窗，將使您的遊戲操作更為方便且高效。<br>
此外，將靈魂彈或魔靈彈分配給偷跑哥布林快捷鍵後，您可以右鍵點選相應的快捷鍵圖示，自動重新裝填靈魂彈或魔靈彈。<br>
