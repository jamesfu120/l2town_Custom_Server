<font color="LEVEL">HP 與 MP 恢復</font><br>
當角色生命值（HP）剩餘不多時，若角色持續狩獵，其生命值將被耗盡，導致角色死亡。若發生此情況，請讓角色坐下，以便更快恢復生命值與魔法值（MP）。要讓角色坐下，請開啟角色資訊視窗，點選「動作」標籤（或按 Alt + C），然後點選「坐下」。<br>
坐之前，請確保你處於無敵性怪物的區域。若你在坐著時遭到攻擊，你的反擊將會延遲，且角色將承受更多傷害。<br>
