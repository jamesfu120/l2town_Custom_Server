<font color="LEVEL">小地圖</font><br>
您可以按壓螢幕右下角的「小地圖」按鈕（Alt+M）來召喚並檢視《Lineage II》世界地圖。對於新手玩家，地圖上標示了《Lineage II》新手指南的位置。若您點選並拖曳目前正在檢視的地圖，您也可以查詢其他地區的地圖。<br>
若您按下「當前位置」按鈕，將顯示您週遭地區的地圖，並以標記指示您的當前位置。此外，若「位置」功能目前已在任務視窗中啟用，只需按下「目標位置」按鈕，即可顯示目的地地圖及標記指示您的目的地。<br>
村莊在地圖上以「+」符號標示。若您按下其中一個按鈕，將顯示相應村莊的詳細地圖。在村莊地圖中，若您按下「-」按鈕，將返回全球地圖。<br>
