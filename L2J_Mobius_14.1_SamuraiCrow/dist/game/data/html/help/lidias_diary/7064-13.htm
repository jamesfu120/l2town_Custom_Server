<html><body>莉迪亞的日記：<br>[不同的手寫]<br>我不明白!當然我做了,但我不知道!我望著鏡子 她的臉望著我,但沒有鏡子! 只是一幅圖片.我不明白這一切!我的記憶在哪裡? 他們似乎在那裡,但不可觸及! 他一定對我做了一些事!<br>發生的一切都會被錄製,但被遺忘! 兩者都後悔 滿意是結果.你的頭髮上的月面花將密封這個合同.<br>
<button action="bypass -h player_help lidias_diary/7064-14.htm#7064" align="LEFT" icon="NORMAL">我指著我的古老,長久被遺忘的名字起誓.</button>!
</body></html>
