<html><body>莉迪亞的日記：<br>
地底之暗<br><br>
星光映照在他的微笑中。<br>
他談論勇氣，但我不知道自己身在何處，甚至不知道自己是誰！<br>
瘋子能有勇氣嗎？
誰知道呢？<br>
他的笑聲響徹四方，又再次傳來「勇氣」這兩個字。  
還有其他字詞，但都用著我無法理解的異界語言。<br>
黑暗法師以他陰鬱的微笑輕聲對我說話，在黑暗的夜晚中緊握我的手。<br>
勇氣。
勇氣。
勇氣。
除此之外，無所掛礙。<br>
我的儀式還在進行中！
你這麼晚來是為什麼？<br>
<button action="bypass -h player_help lidias_diary/7064-09.htm#7064" align="LEFT" icon="NORMAL">我來是想請你幫個忙。</button>
</body></html>
