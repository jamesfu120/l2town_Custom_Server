<html><body>莉迪亞的日記：<br>
………她已去世。
我獨自在此，她已去世。
她是誰？
我在此。
我是誰？
她在城堡裡。
她是誰？
<font color="LEVEL">我們有約。
什麼約？
他是誰？
我說我會的。
要怎麼做？
我失去了它。
失去的是什麼？
我得到了它。
得到的是什麼？
翻頁。
他是誰？</font><br>
我說過我要做。
做什麼？
我弄丟了。
什麼？
我拿到了。
拿到什麼？<br>
<button action="bypass -h player_help lidias_diary/7064-16.htm#7064" align="LEFT" icon="NORMAL">翻頁。</button>
</body></html>
