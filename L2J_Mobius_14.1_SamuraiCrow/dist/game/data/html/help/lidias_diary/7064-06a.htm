<html><body>莉帝雅的日記：<br>
閏七月三十日。<br><br>
明天就是大日子了！
我沒辦法說說爸爸打消這個念頭。
尼德拉的話太有道理了！<br>
乾隆的皇權長久以來一直不穩，必須有所行動！
兄弟艾爾哈德說，我們家族的主要責任是保護乾隆本身，而非皇室！<br>
我不太確定我是否相信所有那些事情……<br>
尼德拉今晚來找我。
他告訴我，不管我做什麼決定，我都要在危難時刻展現勇氣。
他說這句話是什麼意思？
我一直都很勇敢啊！<br>
