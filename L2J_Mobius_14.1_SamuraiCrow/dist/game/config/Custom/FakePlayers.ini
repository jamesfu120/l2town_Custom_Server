# ---------------------------------------------------------------------------
# 假人系統 - UTF-8 繁體中文
# ---------------------------------------------------------------------------
# 開啟假人系統。
EnableFakePlayers = True

# 假人聊天。
FakePlayerChat = True

# 假人使用魂靈彈／魔靈彈。
FakePlayerUseShots = True

# 擊殺假人是否計入 PvP。
FakePlayerKillsRewardPvP = True

# 擊殺未標記假人是否套用 Karma 規則。
FakePlayerUnflaggedKillsKarma = True

# 是否允許玩家直接攻擊假人。
FakePlayerAutoAttackable = True

# 假人是否主動攻擊附近怪物。
FakePlayerAggroMonsters = True

# 假人是否主動攻擊玩家。
FakePlayerAggroPlayers = False

# 假人是否互相攻擊。
FakePlayerAggroFPC = False

# 假人不掉落任何自身物品。
FakePlayerCanDropItems = False

# 假人自動拾取地面掉落物，拾取後立即刪除，不進入背包、不寫入資料庫。
FakePlayerCanPickup = True

# ---------------------------------------------------------------------------
# 動態假人數量與行為
# ---------------------------------------------------------------------------
# 啟動時產生的假人總數。
FakePlayerTotalCount = 60

# 商店型假人數量。
FakePlayerShopCount = 20

# 戰鬥型假人數量。
FakePlayerCombatCount = 950

# 輔助系假人比例。依照戰鬥型假人總數計算；例如戰鬥假人2900、設定30%，目標約870名輔助職業。
# 輔助比例會隨戰鬥假人總數按比例增加：提高總假人人數時，輔助假人數量也會按比例增加。
FakePlayerSupportPercent = 30

# 輔助系法師／牧師自動補血門檻。
# 當任何存活隊友的 HP 低於此百分比時，輔助假人會優先施放自身職業治療技能。
# 治療會持續執行，直到隊友 HP 恢復滿血；可設定 1～99。
FakePlayerSupportHealPercent = 80

# 怪物密度分配：每約5隻符合等級怪物配置1名假人。
FakePlayerDensityMonstersPerFake = 5
FakePlayerDensitySparseGroupMin = 3
FakePlayerDensitySparseGroupMax = 5
FakePlayerDensityDenseGroupMin = 10
FakePlayerDensityDenseGroupMax = 15
FakePlayerDensityReferenceCount = 900

# 真人＋假人隊伍最高人數，範圍自動限制為1～30。
FakePlayerMaxPartyMembers = 30

# 隊長語音指令 .allcome：召回整個隊伍至隊長位置，不限制地圖與等級。
FakePlayerAllComeEnabled = True

# 隨機等級下限。
FakePlayerMinLevel = 1

# 隨機等級上限。
FakePlayerMaxLevel = 120

# 戰鬥距離：進入此距離後開始攻擊目標。
FakePlayerHuntRange = 1500

# 尋找練功區時，在目前位置周圍搜尋的半徑。
FakePlayerHuntSearchRange = 5000

# 自動練功怪物等級下限差：允許打比自己低多少級的怪。
FakePlayerHuntMinLevelDiff = -5

# 自動練功怪物等級上限差：允許打比自己高多少級的怪。
FakePlayerHuntMaxLevelDiff = 5

# AI 思考間隔（秒）。
FakePlayerHuntInterval = 3

# 最高打怪等級差。0 = 最高只打與假人自己同等級的怪物。
FakePlayerHuntMaxLevelDiff = 5

# 假人依 EPIC 14.1 原生種族／職業與等級，自動學會目前可用的全部職業技能。
# 技能只存在記憶體，不寫入資料庫。
FakePlayerAutoLearnClassSkills = True

# 禁止使用布告欄／Community Board 額外 BUFFER。輔助假人只使用自身 EPIC 14.1 原生職業技能。
FakePlayerAutoCommunityBuff = False

# 自動搜尋掉落物距離。
FakePlayerLootRange = 1000

# 實際拾取距離；超過此距離會先自動跑到掉落物旁邊。
FakePlayerPickupDistance = 200

# 隨機產生繁體中文名字。
FakePlayerRandomNames = True

# 啟用自動練功 AI。
FakePlayerAutoHunt = True

# 戰鬥型假人自動接取、執行並嘗試完成任務。
FakePlayerAutoQuest = True

# 商店型假人每間商店隨機產生的販售欄位數量。
FakePlayerShopMinItems = 6
FakePlayerShopMaxItems = 10

# 可堆疊物品的隨機庫存數量。
FakePlayerShopMinStack = 1
FakePlayerShopMaxStack = 100

# 隨機商店單價上下限。
FakePlayerShopMinPrice = 1000
FakePlayerShopMaxPrice = 100000000

# 玩家可以邀請假人加入隊伍。
FakePlayerAllowParty = True

# 允許假人參與 PvP。
FakePlayerAllowPvP = True

# 允許假人參與攻城。
FakePlayerAllowSiege = True

# 假人死亡後原地復活等待秒數。
FakePlayerDeathRespawnDelay = 5

# 戰鬥型假人自動購買的紅水（HP 回復藥水）ID。預設 1060。
FakePlayerHpPotionId = 1060

# 紅水低於此數量時，假人會回城補給。
FakePlayerHpPotionMinCount = 1

# 回城後一次補充到此數量。
FakePlayerHpPotionTargetCount = 10000

# 非裝備中的可販售戰利品達到此數量時，自動回城出售。
# 已停用：假人不購買藥水、不出售撿拾物。
FakePlayerSellLootThreshold = 0

