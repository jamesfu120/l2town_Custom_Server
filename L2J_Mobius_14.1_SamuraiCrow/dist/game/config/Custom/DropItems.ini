# ---------------------------------------------------------------------------
# 自訂指定怪物掉落設定 - UTF-8
# ---------------------------------------------------------------------------
# 格式：怪物ID,物品ID,掉落數量,掉落機率%;多筆請用分號 ; 分隔
# 範例：30263,20041,2,30;52654,24511,5,20
# 每一筆獨立判定，不會覆蓋 NPC XML 原本掉落。
# 100 = 必定掉落；0 < 機率 <= 100。
# ---------------------------------------------------------------------------
DropItems = 

# ---------------------------------------------------------------------------
# 群體怪物掉落設定 - UTF-8
# ---------------------------------------------------------------------------
# 每一筆獨立判定，不會覆蓋 NPC XML 原本掉落。
# 100 = 必定掉落；0 < 機率 <= 100。
# ---------------------------------------------------------------------------
# 是否開啟群體掉落功能，預設 False，如為 True 以下功能才有作用。
GroupDrop = False

# 群體掉落物編號及數量，例：20041,2；多筆請用分號 ; 分隔。
GroupDropItems = 3031,10;1785,50

# 群體掉落物機率 %。
GroupDropProbability = 20

# 群體掉落物時段，例：8,24 代表早上 8 點至午夜 24 點；0,0 代表不限時段。
DropTimeLimit = 0,0

# ---------------------------------------------------------------------------
# 特定日期群體掉落物設定 - UTF-8
# ---------------------------------------------------------------------------
# 日期格式 MMDD，例如 1225 代表每年 12 月 25 日；多筆請用分號 ; 分隔。
# ---------------------------------------------------------------------------
# 是否開啟特定日期群體掉落功能，預設 False。
SpecificDrop = True

# 特定日期設定，例如 0101;1225；空白代表不設定日期。
SpecificDate = 0101;1225;1001;1010;1023

# 特定日期掉落物 ID 及數量，例如 105617,1；多筆請用分號 ; 分隔。
SpecificDropID = 105617,1

# 特定日期掉落物機率 %。
SpecificProbability = 1
