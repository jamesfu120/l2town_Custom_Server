<html><body>仁：<br><br>
歡迎你！<br>
最近怪物們為了得到更強的力量，正在利用屬性魔法力來賦予自己強悍的屬性能力；而為了面對他們，我想你也同樣付出了不少心血來強化屬性魔法力。我在訪查大陸的途中，偶然習得了可操控屬性魔法力的特殊技能。雖然還不能操控威力超強的所有屬性魔法力，但利用我所習得的這一部分技能，應該也可以善加活用！<br>
還有，在調查時可善加利用的這些靈藥，是用特殊成分調製而的，所以我不能免費送你。我的弟子們正冒著危險在收集調製這些靈藥時所需的材料，因此你得去支援他們收集更多的材料才行！<br><br>
