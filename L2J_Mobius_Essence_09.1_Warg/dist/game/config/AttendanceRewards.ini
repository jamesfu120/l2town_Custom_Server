# ---------------------------------------------------------------------------
# Attendance Reward Settings
# ---------------------------------------------------------------------------
# Enable daily login rewards for players.
# To enable this feature you need to set L2.ini UseVIPAttendance value to true.
# Rewards are set at data\AttendanceRewards.xml file.

# Enable the Attendance Reward system.
# Default: False
EnableAttendanceRewards = False

# Enable the Attendance Reward system only for Premium accounts.
# Default: False
PremiumOnlyAttendanceRewards = False

# Enable the Attendance Reward system only for Vip accounts.
# Default: False
VipOnlyAttendanceRewards = False

# Make rewards sharable in the same account.
# Default: False (Each character will receive its own rewards.)
AttendanceRewardsShareAccount = False

# Time in minutes you can redeem your reward after logging in.
# Retail: 30
AttendanceRewardDelay = 30

# Popup the reward window when player enters the game.
# Default: True
AttendancePopupStart = True

# Popup the reward window if reward is available after the login delay.
# Default: False
AttendancePopupWindow = True

# Loop attendance rewards after all days are claimed.
# If True: resets back to day 1 after the last reward, all slots shown as unclaimed again.
# If False: stops rewarding and hides the popup once all rewards are claimed.
# Default: False
AttendanceRewardsLoop = False

# ---------------------------------------------------------------------------
# Real-Days Mode Settings
# ---------------------------------------------------------------------------
# Tie each attendance reward day to a real calendar date.
# If True: each reward day corresponds to a real calendar day in the cycle.
#   - The first unclaimed day is claimable for free after AttendanceRewardDelay.
#   - Days missed between last claimed and today are purchasable with a fee item, in order.
#   - Cycle resets cleanly on AttendanceCycleStartDay each month.
# If False: original behavior (one reward per login, no calendar tie).
# Default: False
AttendanceRewardsMatchRealDays = False

# The day of month on which the attendance cycle starts (resets).
# Example: 1 = cycle starts on the 1st of each month, 15 = starts on the 15th.
# Default: 1
AttendanceCycleStartDay = 1

# Threshold sent to the client to control the coin purchase UI for missed attendance days.
# The client uses item ID 91663 (L Coin) x100 as the purchase cost,
# this is hardcoded in the client dat files and cannot be changed server-side.
# This value tells the client from which day onward the coin purchase button is shown.
# Retail: 26
# Disabled: 1
RewardLCoinCheck = 26